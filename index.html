<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DALL — Download All</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #7c5cff;
    --cyan: #00c9ff;
    --pink: #ff44ee;
    --green: #00e5aa;
    --red: #ff6b6b;
    --dark-bg: #030308;
  }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--dark-bg);
    color: #ececff;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-orbs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 15% 15%, rgba(124, 92, 255, 0.22) 0%, transparent 65%),
      radial-gradient(ellipse 50% 35% at 85% 20%, rgba(0, 201, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 85%, rgba(255, 68, 238, 0.15) 0%, transparent 70%);
  }
  .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 60px 20px 100px; }
  header { text-align: center; margin-bottom: 45px; }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.5rem, 14vw, 7rem);
    letter-spacing: 6px; line-height: 0.95;
    background: linear-gradient(135deg, #a78bff 0%, #00c9ff 50%, #ff44ee 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 35px rgba(124, 92, 255, 0.5));
  }
  .logo-sub { font-size: 0.8rem; letter-spacing: 0.4em; color: #7c7cff; text-transform: uppercase; margin-top: 10px; font-weight: 700; }
  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border-radius: 24px; padding: 28px;
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    margin-bottom: 24px;
  }
  .lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #8b8bff; font-weight: 700; margin-bottom: 12px; display: block; }
  .url-row { display: flex; gap: 12px; }
  .inp {
    flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px; padding: 15px 20px; color: #fff; font-size: 0.95rem; font-family: inherit;
    outline: none; transition: all 0.25s ease;
  }
  .inp:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 201, 255, 0.25); background: rgba(0, 0, 0, 0.6); }
  .btn { padding: 15px 28px; border-radius: 16px; border: none; color: #fff; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; }
  .btn-gradient { background: linear-gradient(135deg, var(--purple), var(--cyan)); box-shadow: 0 0 25px rgba(124, 92, 255, 0.4); }
  .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0, 201, 255, 0.6); opacity: 0.95; }
  .preview { display: none; margin-top: 10px; }
  .preview.show { display: block; }
  .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 24px 0; }
  .thumb-row { display: flex; gap: 18px; align-items: center; margin-bottom: 24px; }
  .thumb-img { width: 150px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); }
  .vid-title { font-weight: 600; font-size: 1.1rem; color: #fff; line-height: 1.4; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .fbtn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 16px; color: #fff; cursor: pointer; transition: all 0.2s ease; text-align: center; font-weight: 600; font-size: 0.9rem; }
  .fbtn:hover { background: linear-gradient(135deg, rgba(124,92,255,0.2), rgba(0,201,255,0.2)); border-color: var(--cyan); transform: scale(1.02); }
  #dlmsg { text-align: center; font-size: 0.95rem; margin-top: 20px; font-weight: 500; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); margin-right: 8px; animation: blink 1.2s infinite alternate; }
  @keyframes blink { from { opacity: 0.3; transform: scale(0.9); } to { opacity: 1; transform: scale(1.2); } }
</style>
</head>
<body>
<div class="bg-orbs"></div>
<div class="wrap">
  <header>
    <div class="logo">DALL</div>
    <div class="logo-sub">Download All Media</div>
  </header>
  <div class="card">
    <label class="lbl">Paste Any Media Link</label>
    <div class="url-row">
      <input type="text" id="vurl" class="inp" placeholder="Paste YouTube, TikTok, Instagram link here..." />
      <button id="fetch-btn" class="btn btn-gradient" onclick="fetchVideoInfo()">Analyze Link</button>
    </div>
    <div class="preview" id="preview-box">
      <div class="divider"></div>
      <div class="thumb-row">
        <img id="vid-thumb" class="thumb-img" src="" alt="Thumbnail" />
        <div id="vid-title" class="vid-title">Analyzing content structures...</div>
      </div>
      <label class="lbl">Select Format Quality</label>
      <div class="fgrid" id="formats-box"></div>
      <div id="dlmsg"></div>
    </div>
  </div>
</div>
<script>
  // ⚠️ PASTE YOUR COPIED RENDER URL HERE BETWEEN THE QUOTES:
  const serverTarget = "https://dall-x7y8.onrender.com";

  async function fetchVideoInfo() {
    const url = document.getElementById('vurl').value.trim();
    if (!url) return alert("Please enter a link!");
    const msg = document.getElementById('dlmsg');
    const pBox = document.getElementById('preview-box');
    pBox.className = "preview"; 
    msg.innerHTML = '<span class="pulse"></span>Fetching video formats...';
    msg.style.color = "var(--cyan)";
    try {
      const res = await fetch(serverTarget + '/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) {
        msg.textContent = "❌ " + data.error;
        msg.style.color = "var(--red)";
        return;
      }
      document.getElementById('vid-thumb').src = data.thumbnail || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe";
      document.getElementById('vid-title').textContent = data.title;
      const fBox = document.getElementById('formats-box');
      fBox.innerHTML = "";
      data.formats.forEach(f => {
        const btn = document.createElement('button');
        btn.className = "fbtn";
        btn.textContent = f.label;
        btn.onclick = () => triggerDownload(url, f.id, f.ext);
        fBox.appendChild(btn);
      });
      msg.innerHTML = "";
      pBox.className = "preview show";
    } catch(e) {
      msg.textContent = "❌ Server is waking up or temporarily unreachable. Try again in a few seconds!";
      msg.style.color = "var(--red)";
    }
  }
  async function triggerDownload(url, format_id, ext) {
    const msg = document.getElementById('dlmsg');
    msg.innerHTML = '<span class="pulse"></span>Downloading video and converting tracks. Your browser will prompt download confirmation shortly...';
    msg.style.color = "var(--green)";
    try {
      const response = await fetch(serverTarget + '/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format_id })
      });
      if (!response.ok) throw new Error("Download failed");
      const blob = await response.blob();
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `DALL_${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(downloadUrl);
      a.remove();
      msg.textContent = "✨ Saved successfully straight to your device!";
    } catch (error) {
      msg.textContent = "❌ Processing timeout error on large files.";
      msg.style.color = "var(--red)";
    }
  }
</script>
</body>
</html>
